    <rect x="10" y="38" width="8" height="22" rx="4" fill="url(#pgGradient)" opacity="0.6" />
    <!-- Bar 2 -->
    <rect x="22" y="26" width="8" height="34" rx="4" fill="url(#pgGradient)" opacity="0.85" />
    <!-- Flame Pitch Top -->
